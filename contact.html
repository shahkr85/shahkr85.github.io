<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Get in touch with Krutik Shah." />
        <meta name="author" content="Krutik Shah" />
        <meta name="theme-color" content="#0D1117" />
        <title>Contact Me</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Site theme-->
        <link href="css/site.css" rel="stylesheet" />

        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-9LXVKJ7DK8"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-9LXVKJ7DK8');
        </script>
        <script src="https://www.google.com/recaptcha/enterprise.js?render=6LdApN8qAAAAAGpFqGqoSKTdirst_bkwD_s4mhjN"></script>
    </head>
    <body>
        <main>
            <!-- Navigation-->
            <nav class="container nav" aria-label="Main">
                <a class="brand" href="index.html">Krutik Shah<span class="cursor">_</span></a>
                <div class="nav-links">
                    <a href="index.html">/home</a>
                    <a href="projects.html">/projects</a>
                    <a href="photography.html">/photos</a>
                    <a href="contact.html" aria-current="page">/contact</a>
                    <a class="nav-resume" href="Resume.pdf">resume<span class="ext">.pdf</span> ↓</a>
                </div>
            </nav>

            <!-- Page header-->
            <header class="container page-head">
                <div class="glow" aria-hidden="true"></div>
                <div class="label">// contact</div>
                <h1>Get in touch<span style="color: var(--accent)">_</span></h1>
                <p>Let's work together! Send a message and I'll get back to you.</p>
            </header>

            <!-- Contact form-->
            <section class="container">
                <form class="form-card" action="https://formspree.io/f/meqbjagy" method="post" id="contactForm" name="contactForm">
                    <div class="field">
                        <label for="name">Full name</label>
                        <input id="name" name="name" type="text" placeholder="Jane Doe" autocomplete="name" required />
                    </div>
                    <div class="field">
                        <label for="email">Email address</label>
                        <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required />
                    </div>
                    <div class="field">
                        <label for="phone">Phone number <span class="opt">(optional)</span></label>
                        <input id="phone" name="phone" type="tel" placeholder="(123) 456-7890" autocomplete="tel" />
                    </div>
                    <div class="field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="What would you like to build?" required></textarea>
                    </div>
                    <button class="g-recaptcha btn btn-primary"
                        data-sitekey="6LdApN8qAAAAAGpFqGqoSKTdirst_bkwD_s4mhjN"
                        data-callback='onSubmit'
                        data-action='submit'>Send message</button>
                </form>
                <script>
                    function onSubmit(token) {
                        var form = document.getElementById("contactForm");
                        if (form.reportValidity()) {
                            form.submit();
                        }
                    }
                </script>

                <div class="socials">
                    <a href="https://www.linkedin.com/in/krutik-p-shah/" aria-label="LinkedIn"><i class="bi bi-linkedin" aria-hidden="true"></i></a>
                    <a href="https://github.com/shahkr85" aria-label="GitHub"><i class="bi bi-github" aria-hidden="true"></i></a>
                </div>
            </section>
        </main>

        <!-- Footer-->
        <footer class="container footer">
            <span>© 2026 Krutik Shah</span><span>exit 0</span>
        </footer>
    </body>
</html>
